version: 1

location:
  lat: 50.08
  lon: 14.43

http:
  listen: ":8080"

mqtt:
  broker: "tcp://localhost:1883"
  client_id: "homedash"
  # Credentials are loaded from MQTT_USERNAME / MQTT_PASSWORD in secrets.env.
  #
  # Each entry maps one (topic, field) -> one sensor row. Multiple entries
  # may share the same topic; the client subscribes once and fans the JSON
  # payload out by `field` (dotted path, e.g. "particles.p25um").
  # Omit `field` if the payload is a bare number / string or a JSON object
  # whose value lives under a top-level "value" key.
  topics:
    - topic: "funhouse/state"
      field: "temperature"
      name: "Temperature"
      unit: "°C"
      group: "indoor"
      decimals: 1
      stale_after: "10m"
    - topic: "funhouse/state"
      field: "humidity"
      name: "Humidity"
      unit: "%"
      group: "indoor"
      decimals: 0
      stale_after: "10m"
    - topic: "sensors/outdoor/temp"
      name: "Outdoor Temp"
      unit: "°C"
      group: "outdoor"
      decimals: 1
      stale_after: "5m"

calendars:
  poll_minutes: 15
  include:
    - "Personal"
    - "Family"

reminders:
  list_name: "Dashboard"

weather:
  poll_minutes: 30

rss:
  poll_minutes: 15
  feeds:
    - "https://example.com/feed.xml"

photos:
  shared_album_url: "https://www.icloud.com/sharedalbum/#XXXXXXX"
  refresh_hours: 6
  cache_dir: "/var/lib/homedash/photos"
  # How long each photo stays on screen, in seconds.
  slideshow_seconds: 900

google:
  # Cached after running `homedash auth-google -config /etc/homedash/config.yaml`
  # once on a machine with a browser. Then copy this file to the Pi.
  token_file: "/var/lib/homedash/google_token.json"
  # Set to Google Calendar titles to use Google instead of CalDAV for
  # events. Empty = keep CalDAV (iCloud) calendar.
  calendars_include: []
  # Set to a Google Tasks list title to use Google instead of CalDAV
  # for reminders. Empty = keep CalDAV reminders.
  tasks_list: ""
  # Photos: run `homedash pick-photos` once on a machine with a browser
  # to fill photos.cache_dir from Google Photos via the Picker API.
